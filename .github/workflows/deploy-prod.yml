name: Deploy production

on:
  push:
    tags: ["v*.*.*"]

concurrency: deploy-prod

permissions:
  contents: read
  id-token: write # lets the job sign in to Google Cloud without a stored key

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in GitHub to make each
    # production deploy wait for approval.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main. Merge to main first, then tag." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, deploy and confirm
        run: bash scripts/deploy.sh
        env:
          SERVICE: site-prod
          SITE_ENV: production
          APP_VERSION: ${{ github.ref_name }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_TO_GENERAL: ${{ vars.CONTACT_TO_GENERAL }}
          CONTACT_TO_SALES: ${{ vars.CONTACT_TO_SALES }}
          CONTACT_TO_CAREERS: ${{ vars.CONTACT_TO_CAREERS }}
          CONTACT_TO_SUPPORT: ${{ vars.CONTACT_TO_SUPPORT }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
